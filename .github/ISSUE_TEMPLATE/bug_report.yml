name: Bug report
description: Report reproducible go-colab behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include OAuth tokens, ADC files, runtime URLs, proxy tokens, private keys, or production logs.
  - type: input
    id: version
    attributes:
      label: go-colab version or commit
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets and use a mock endpoint where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
